version: 2

project_name: credentialctl

before:
  hooks:
    - make fetch-credentio-lib

builds:
  - id: credentialctl-darwin-arm64
    main: ./main.go
    binary: credentialctl
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I{{.Env.PWD}}/third_party/credentio/include
      - CGO_LDFLAGS=-L{{.Env.PWD}}/third_party/credentio/lib -lcredentio_c -Wl,-rpath,@loader_path
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: third_party/credentio/lib/libcredentio_c.dylib
        dst: ./

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
