name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          install-only: true

      - name: Fetch Credentio native library
        run: |
          chmod +x scripts/fetch-credentio-lib.sh
          ./scripts/fetch-credentio-lib.sh 0.1.5

      - name: Run tests
        run: make test

      - name: Build binary
        run: make build

      - name: Verify CLI version
        run: ./bin/credentialctl version --json

      - name: Test GoReleaser snapshot build
        run: make release-snapshot
